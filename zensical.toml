[project]
site_name = "ai-devkit"
site_description = "A portable, versioned development toolchain and engineering standards for small Python projects built with coding agents."
site_author = "ai-devkit maintainers"
docs_dir = "docs"
site_dir = "site"

# Fail the build when link validation reports a problem. `mise run docs` also
# passes --strict so the check does not depend on this setting alone.
strict = true

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Getting started" = "tutorials/getting-started.md" },
    { "Create your first Python project" = "tutorials/first-python-project.md" },
    { "Plan, implement and archive one change" = "tutorials/spec-driven-change.md" },
  ] },
  { "How-to guides" = [
    { "Install the development toolchain" = "how-to/install-toolchain.md" },
    { "Initialize OpenSpec in a project" = "how-to/initialize-openspec.md" },
    { "Validate changes and specifications" = "how-to/validate-openspec.md" },
    { "Configure coding agents" = "how-to/configure-coding-agents.md" },
    { "Troubleshoot agent setup" = "how-to/troubleshoot-agent-setup.md" },
    { "Update a project's overlay" = "how-to/update-project-overlay.md" },
    { "Diagnose a failed CI job" = "how-to/diagnose-ci-failure.md" },
  ] },
  { "Reference" = [
    { "Tool ownership and pinned versions" = "reference/tool-versions.md" },
    { "Generated project: commands and contents" = "reference/generated-project.md" },
    { "Continuous integration" = "reference/continuous-integration.md" },
    { "OpenSpec: commands and generated files" = "reference/openspec.md" },
    { "Agent configuration" = "reference/agent-configuration.md" },
  ] },
  { "Explanation" = [
    { "Reproducibility and Python ownership" = "explanation/reproducibility.md" },
    { "Who owns which file in a generated project" = "explanation/generated-project-ownership.md" },
    { "Why verification and updates share one command" = "explanation/verification-and-updates.md" },
    { "OpenSpec, AGENTS.md and ADRs" = "explanation/openspec-and-agents.md" },
    { "Why agent configuration stays native" = "explanation/agent-independence.md" },
    { "ADR 0001: minimal configuration-first devkit" = "explanation/decisions/0001-minimal-devkit.md" },
    { "ADR 0002: script project overlay" = "explanation/decisions/0002-script-project-overlay.md" },
    { "ai-devkit v0.1 implementation plan" = "plans/ai-devkit-v0.1.md" },
  ] },
  { "Releases" = [
    { "v0.1.0 release candidate" = "releases/v0.1.0.md" },
    { "v0.1.0 acceptance report" = "releases/v0.1.0-acceptance-report.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.footer",
  "navigation.tracking",
  "content.code.copy",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
toc.permalink = true
